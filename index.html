    ctx.moveTo(396, 200);
    ctx.lineTo(412, 112); ctx.lineTo(456, 164); ctx.lineTo(500, 96);
    ctx.lineTo(544, 164); ctx.lineTo(588, 112); ctx.lineTo(604, 200);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#B8341F";
    for (const x of [440, 500, 560]) { ctx.beginPath(); ctx.arc(x, 182, 8, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
  },
  glasses(ctx) {
    ctx.save();
    ctx.strokeStyle = "#4A3B2E"; ctx.lineWidth = 7;
    ctx.fillStyle = "rgba(210,235,245,.26)";
    for (const e of [EYE_L, EYE_R]) {
      ctx.beginPath(); ctx.arc(e[0], e[1] + 2, 56, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(EYE_L[0] + 56, 312); ctx.quadraticCurveTo(500, 300, EYE_R[0] - 56, 312); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(EYE_L[0] - 56, 310); ctx.lineTo(360, 288); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(EYE_R[0] + 56, 310); ctx.lineTo(640, 288); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 4;
    for (const e of [EYE_L, EYE_R]) { ctx.beginPath(); ctx.arc(e[0], e[1] + 2, 48, -2.5, -1.7); ctx.stroke(); }
    ctx.restore();
  },
};

function drawWearables(ctx, layer) {
  const w = S.worn;
  if (layer === "neck" && w.neck) { if (w.neck === "collar") Wear.collar(ctx); if (w.neck === "scarf") Wear.scarf(ctx); }
  if (layer === "head" && w.head) { if (w.head === "bow") Wear.bow(ctx); if (w.head === "hat") Wear.hat(ctx); if (w.head === "crown") Wear.crown(ctx); }
  if (layer === "face" && w.face === "glasses") Wear.glasses(ctx);
}

/* ---------- комнаты ---------- */

function drawRoom(ctx, w, h, t) {
  const id = S.room;
  const horizon = h * 0.62;
  if (id === "garden") {
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, "#8FC4DD"); sky.addColorStop(1, "#D7EAE2");
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, horizon);
    ctx.fillStyle = "#7FA85C"; ctx.fillRect(0, horizon, w, h - horizon);
    ctx.fillStyle = "#6B9450";
    for (let i = 0; i < 5; i++) {
      const x = (i / 4) * w, r = w * 0.14;
      ctx.beginPath(); ctx.ellipse(x, horizon + 6, r, r * 0.55, 0, Math.PI, 0); ctx.fill();
    }
    ctx.fillStyle = "#8FBE68";
    for (let i = 0; i < 60; i++) {
      const x = ((i * 137) % 100) / 100 * w, y = horizon + ((i * 53) % 100) / 100 * (h - horizon);
      ctx.fillRect(x, y, 2, 7 + (i % 4) * 3);
    }
    // бабочка
    const bx = w * 0.2 + Math.sin(t / 1400) * w * 0.12, by = horizon - 60 + Math.cos(t / 900) * 24;
    ctx.fillStyle = "#F2C14E";
    const flap = Math.abs(Math.sin(t / 110));
    ctx.beginPath(); ctx.ellipse(bx - 7, by, 8 * flap + 2, 9, -0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(bx + 7, by, 8 * flap + 2, 9, 0.4, 0, Math.PI * 2); ctx.fill();
    return;
  }

  const night = id === "night";
  const wall = ctx.createLinearGradient(0, 0, 0, horizon);
  if (night) { wall.addColorStop(0, "#2B2740"); wall.addColorStop(1, "#1C1A2B"); }
  else { wall.addColorStop(0, "#F0E2CC"); wall.addColorStop(1, "#DFCCAE"); }
  ctx.fillStyle = wall; ctx.fillRect(0, 0, w, horizon);

  const floor = ctx.createLinearGradient(0, horizon, 0, h);
  if (night) { floor.addColorStop(0, "#3A3042"); floor.addColorStop(1, "#241F2D"); }
  else { floor.addColorStop(0, "#C09366"); floor.addColorStop(1, "#9A7249"); }
  ctx.fillStyle = floor; ctx.fillRect(0, horizon, w, h - horizon);

  // доски пола
  ctx.save();
  ctx.strokeStyle = night ? "rgba(0,0,0,.3)" : "rgba(90,60,30,.28)";
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 9; i++) {
    const y = horizon + ((h - horizon) * i) / 9;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  ctx.restore();

  // плинтус
  ctx.fillStyle = night ? "#4A4059" : "#E7D7BC";
  ctx.fillRect(0, horizon - 14, w, 14);

  if (id === "window" || night) {
    const wx = w * 0.14, wy = h * 0.1, ww = w * 0.3, wh = h * 0.34;
    ctx.fillStyle = night ? "#121A2E" : "#BFE0EE";
    ctx.fillRect(wx, wy, ww, wh);
    if (night) {
      ctx.fillStyle = "#F3EBC8";
      ctx.beginPath(); ctx.arc(wx + ww * 0.68, wy + wh * 0.3, Math.min(ww, wh) * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.75)";
      for (let i = 0; i < 14; i++) {
        const sx = wx + ((i * 61) % 100) / 100 * ww, sy = wy + ((i * 37) % 100) / 100 * wh;
        const tw = 0.5 + 0.5 * Math.sin(t / 400 + i);
        ctx.globalAlpha = 0.4 + tw * 0.5;
        ctx.fillRect(sx, sy, 2, 2);
      }
      ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = "#9AC9A0";
      ctx.beginPath(); ctx.ellipse(wx + ww * 0.3, wy + wh * 0.92, ww * 0.3, wh * 0.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "rgba(255,240,190,.5)";
      ctx.beginPath();
      ctx.moveTo(wx, horizon + 10); ctx.lineTo(wx + ww, horizon + 10);
      ctx.lineTo(wx + ww * 1.5, h); ctx.lineTo(wx - ww * 0.3, h);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = night ? "#59496B" : "#F6EDDD"; ctx.lineWidth = 10;
    ctx.strokeRect(wx, wy, ww, wh);
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(wx + ww / 2, wy); ctx.lineTo(wx + ww / 2, wy + wh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(wx, wy + wh / 2); ctx.lineTo(wx + ww, wy + wh / 2); ctx.stroke();
  }

  if (night) {
    // гирлянда
    ctx.strokeStyle = "rgba(255,255,255,.2)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, h * 0.08); ctx.quadraticCurveTo(w / 2, h * 0.17, w, h * 0.06); ctx.stroke();
    for (let i = 0; i <= 10; i++) {
      const p = i / 10;
      const x = p * w, y = h * 0.08 + Math.sin(p * Math.PI) * h * 0.07;
      const glow = 0.5 + 0.5 * Math.sin(t / 500 + i * 1.3);
      ctx.fillStyle = ["#F2C14E", "#E88B6B", "#7FB3C8"][i % 3];
      ctx.globalAlpha = 0.5 + glow * 0.5;
      ctx.beginPath(); ctx.arc(x, y + 8, 5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // коврик
  ctx.save();
  ctx.fillStyle = night ? "rgba(90,70,110,.5)" : "rgba(176,110,78,.45)";
  ctx.beginPath(); ctx.ellipse(w / 2, h * 0.9, w * 0.38, h * 0.09, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
</script>

<script>
"use strict";
/* ============================================================
   Анимация, прикосновения и действия ухода.
   ============================================================ */

const sceneEl = document.getElementById("scene");
const cv = document.getElementById("cat-canvas");
const ctx = cv.getContext("2d");
const bubbleEl = document.getElementById("bubble");

let W = 0, H = 0, DPR = 1, catScale = 1, ox = 0, floorY = 0;

// Плавно тянущиеся значения анимации.
const A = {
  blink: 0, blinkAt: 0, lid: 0, squint: 0, pupil: 0.5, smile: 0.2, mouth: 0, whisker: 0,
  lookX: 0, lookY: 0, tLookX: 0, tLookY: 0,
  tail: 0, tailSpeed: 1, tailAmp: 1, earTwitch: 0, earAt: 0,
  petting: 0, purring: false, hearts: [], crumbs: [], foam: [], sparks: [],
  eat: 0, eatFood: null, wash: 0, headShake: 0, bounce: 0, startled: 0,
};

function resize() {
  const r = sceneEl.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  catScale = Math.min(W / 700, H / 950);
  ox = W / 2;
  floorY = H * 0.965;
  Cat.build(Math.max(0.5, catScale * DPR));
}

function toVirtual(px, py) {
  return { x: (px - ox) / catScale + 500, y: (py - floorY) / catScale + 898 };
}

function ease(cur, target, k, dt) { return cur + (target - cur) * (1 - Math.exp(-k * dt)); }

function say(text, ms) {
  bubbleEl.textContent = text;
  bubbleEl.classList.add("show");
  clearTimeout(say._t);
  say._t = setTimeout(() => bubbleEl.classList.remove("show"), ms || 2200);
}

function popCoins(n, px, py) {
  const el = document.createElement("div");
  el.className = "coin-pop";
  el.textContent = (n > 0 ? "+" : "") + n;
  el.style.left = (px || W / 2) + "px";
  el.style.top = (py || H * 0.4) + "px";
  sceneEl.appendChild(el);
  const t0 = performance.now();
  (function fly() {
    const p = (performance.now() - t0) / 900;
    if (p >= 1) { el.remove(); return; }
    el.style.transform = "translateY(" + (-60 * p) + "px)";
    el.style.opacity = String(1 - p);
    requestAnimationFrame(fly);
  })();
}

function addCoins(n, px, py) {
  S.coins = Math.max(0, S.coins + n);
  popCoins(n, px, py);
  if (n > 0) Sound.coin();
  updateHUD(); save();
}

/* ---------- цели анимации по настроению ---------- */

function moodTargets() {
  const m = mood();
  const base = { lid: 0, squint: 0.06, pupil: 0.45, smile: 0.2, mouth: 0, whisker: 0, tailSpeed: 1, tailAmp: 1 };
  if (m === "sleep")  return { lid: 1, squint: 0, pupil: 0.3, smile: 0.35, mouth: 0, whisker: 0.4, tailSpeed: 0.25, tailAmp: 0.35 };
  if (m === "sleepy") return { lid: 0.55, squint: 0.2, pupil: 0.6, smile: 0.1, mouth: 0, whisker: 0.5, tailSpeed: 0.5, tailAmp: 0.6 };
  if (m === "happy")  return { lid: 0, squint: 0.52, pupil: 0.5, smile: 1, mouth: 0, whisker: -0.3, tailSpeed: 2.1, tailAmp: 1.5 };
  if (m === "hungry") return { lid: 0, squint: 0, pupil: 0.92, smile: 0, mouth: 0.25, whisker: 0.2, tailSpeed: 1.7, tailAmp: 1.2 };
  if (m === "sad")    return { lid: 0.3, squint: 0.1, pupil: 0.7, smile: 0, mouth: 0, whisker: 1, tailSpeed: 0.45, tailAmp: 0.4 };
  if (m === "dirty")  return { lid: 0.18, squint: 0.12, pupil: 0.55, smile: 0.05, mouth: 0, whisker: 0.7, tailSpeed: 0.8, tailAmp: 0.8 };
  return base;
}

/* ---------- кадр ---------- */

let last = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now;

  // моргание: раз в 2.5–6 с, быстрое
  if (now > A.blinkAt) { A.blinkAt = now + 2500 + Math.random() * 3500; A.blink = 1; }
  A.blink = Math.max(0, A.blink - dt * 7);
  const blinkCurve = Math.sin(Math.min(1, A.blink) * Math.PI);

  // подёргивание уха
  if (now > A.earAt) { A.earAt = now + 4000 + Math.random() * 6000; A.earTwitch = 1; }
  A.earTwitch = Math.max(0, A.earTwitch - dt * 4);

  const tg = moodTargets();
  const petBoost = Math.min(1, A.petting);
  A.lid = ease(A.lid, tg.lid, 6, dt);
  A.squint = ease(A.squint, Math.max(tg.squint, petBoost * 0.6), 6, dt);
  A.pupil = ease(A.pupil, tg.pupil, 4, dt);
  A.smile = ease(A.smile, Math.max(tg.smile, petBoost), 5, dt);
  A.mouth = ease(A.mouth, tg.mouth * (0.6 + 0.4 * Math.sin(t / 420)) + A.eat * 0.5, 8, dt);
  A.whisker = ease(A.whisker, tg.whisker, 4, dt);
  A.tailSpeed = ease(A.tailSpeed, tg.tailSpeed, 3, dt);
  A.tailAmp = ease(A.tailAmp, tg.tailAmp, 3, dt);
  A.lookX = ease(A.lookX, A.tLookX, 7, dt);
  A.lookY = ease(A.lookY, A.tLookY, 7, dt);
  A.tail += dt * A.tailSpeed;
  A.petting = Math.max(0, A.petting - dt * 0.8);
  A.startled = Math.max(0, A.startled - dt * 2.5);
  A.headShake = Math.max(0, A.headShake - dt * 2.2);
  A.bounce = Math.max(0, A.bounce - dt * 2.4);
  A.eat = Math.max(0, A.eat - dt * 0.55);
  A.wash = Math.max(0, A.wash - dt * 0.35);

  if (A.purring !== (A.petting > 0.15 && !S.sleeping)) {
    A.purring = A.petting > 0.15 && !S.sleeping;
    Sound.purr(A.purring);
  }

  // ---- рисуем ----
  ctx.clearRect(0, 0, W, H);
  drawRoom(ctx, W, H, t);

  const breath = Math.sin(t / (S.sleeping ? 2100 : 1300)) * (S.sleeping ? 0.022 : 0.012);
  const sit = S.sleeping ? 26 : 0;

  ctx.save();
  ctx.translate(ox, floorY);
  ctx.scale(catScale, catScale);
  ctx.translate(-500, -898 + sit);

  // тень
  ctx.save();
  ctx.fillStyle = "rgba(40,24,14,.28)";
  ctx.beginPath(); ctx.ellipse(500, 902, 230, 34, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  const L = Cat.layers;
  if (L) {
    // тело — «дышит»
    ctx.save();
    ctx.translate(500, 898);
    ctx.scale(1 + breath * 0.6, 1 - breath);
    ctx.translate(-500, -898);
    ctx.drawImage(L.body.cv, L.body.x0, L.body.y0, L.body.w, L.body.h);
    ctx.restore();

    // хвост обёрнут вокруг лап, поэтому поверх тела
    ctx.save();
    ctx.translate(TAIL_BASE[0], TAIL_BASE[1]);
    const flick = mood() === "sad" || mood() === "dirty" ? 0.5 : 1;
    ctx.rotate(Math.sin(A.tail * 1.6) * 0.07 * A.tailAmp * flick);
    ctx.drawImage(L.tail.cv, L.tail.x0, L.tail.y0, L.tail.w, L.tail.h);
    ctx.restore();

    drawWearables(ctx, "neck");

    // голова: наклон к курсору, подпрыгивание, подёргивание уха
    ctx.save();
    ctx.translate(500, 470);
    const tilt = A.lookX * 0.1 + Math.sin(t / 2600) * 0.02 + Math.sin(t / 60) * 0.02 * A.headShake;
    ctx.rotate(tilt);
    const headY = -breath * 70 - A.bounce * 26 + (S.sleeping ? 34 : 0) + A.eat * 40;
    ctx.translate(A.lookX * 10, headY);
    ctx.translate(-500, -470);
    ctx.save();
    if (A.earTwitch > 0) { ctx.translate(500, 300); ctx.rotate(Math.sin(A.earTwitch * 22) * 0.02 * A.earTwitch); ctx.translate(-500, -300); }
    ctx.drawImage(L.head.cv, L.head.x0, L.head.y0, L.head.w, L.head.h);
    ctx.restore();
    drawFace(ctx, {
      blink: blinkCurve * 0.9, lid: Math.max(A.lid, blinkCurve), squint: A.squint,
      pupil: A.pupil, smile: A.smile, mouth: A.mouth, whisker: A.whisker,
      lookX: A.lookX, lookY: A.lookY,
    });
    drawWearables(ctx, "face");
    drawWearables(ctx, "head");
    ctx.restore();
  }

  // грязь поверх шерсти
  if (S.stats.clean < 55) {
    const dirt = (55 - S.stats.clean) / 55;
    const rnd = rngFrom("dirt");
    ctx.save();
    ctx.globalAlpha = Math.min(0.5, dirt * 0.55);
    ctx.fillStyle = "#6B4A2A";
    for (let i = 0; i < 16; i++) {
      const x = 360 + rnd() * 280, y = 460 + rnd() * 420, r = 9 + rnd() * 20;
      ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.7, rnd() * 3, 0, Math.PI * 2); ctx.fill();
    }
    if (dirt > 0.6) {
      ctx.globalAlpha = 0.55; ctx.fillStyle = "#4F4A2A";
      for (let i = 0; i < 8; i++) {
        const x = 380 + rnd() * 240, y = 280 + rnd() * 160, r = 5 + rnd() * 9;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.restore();
  }

  // миска с едой
  if (A.eat > 0.02 && A.eatFood) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, A.eat * 2);
    ctx.fillStyle = "#B6BEC4";
    ctx.beginPath(); ctx.ellipse(500, 880, 118, 36, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#8E989F";
    ctx.beginPath(); ctx.ellipse(500, 872, 92, 26, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = A.eatFood === "milk" ? "#F6F2E7" : "#C98247";
    ctx.beginPath(); ctx.ellipse(500, 870, 78 * Math.min(1, A.eat * 1.4), 20 * Math.min(1, A.eat * 1.4), 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // пена при мытье
  for (let i = A.foam.length - 1; i >= 0; i--) {
    const f = A.foam[i];
    f.y -= f.v * dt * 60; f.life -= dt;
    if (f.life <= 0) { A.foam.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(0.85, f.life);
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(170,205,220,.8)"; ctx.lineWidth = 1.4; ctx.stroke();
    ctx.restore();
  }

  // сердечки от поглаживаний
  for (let i = A.hearts.length - 1; i >= 0; i--) {
    const hh = A.hearts[i];
    hh.y -= dt * 90; hh.life -= dt;
    if (hh.life <= 0) { A.hearts.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, hh.life);
    ctx.translate(hh.x, hh.y);
    ctx.scale(hh.s, hh.s);
    ctx.fillStyle = "#D8537E";
    ctx.beginPath();
    ctx.moveTo(0, 8);
    ctx.bezierCurveTo(-14, -4, -8, -16, 0, -8);
    ctx.bezierCurveTo(8, -16, 14, -4, 0, 8);
    ctx.fill();
    ctx.restore();
  }

  // «Zzz» во сне
  if (S.sleeping) {
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,.75)";
    ctx.font = "600 44px " + "Fraunces, Georgia, serif";
    for (let i = 0; i < 3; i++) {
      const p = ((t / 2600) + i * 0.33) % 1;
      ctx.globalAlpha = Math.sin(p * Math.PI) * 0.8;
      ctx.fillText("z", 640 + p * 70, 300 - p * 150 + i * 6);
    }
    ctx.restore();
  }

  ctx.restore();
  requestAnimationFrame(frame);
}

/* ---------- прикосновения ---------- */

function zoneAt(v) {
  const dx = v.x - 500;
  if (v.y < 240 && Math.abs(dx) > 55 && Math.abs(dx) < 200) return "ear";
  if (Math.hypot(v.x - NOSE[0], v.y - NOSE[1]) < 52) return "nose";
  if (Math.hypot(dx / 165, (v.y - 330) / 155) < 1.1) return "head";
  if (v.y > 760 && v.x > 600) return "tail";
  if (Math.hypot(dx / 175, (v.y - 680) / 240) < 1.05) return "belly";
  return "floor";
}

const REACT = {
  ear:   ["Ухом дёрнул — щекотно.", "Ухо не трогай, оно важное.", "Мррр… ещё?"],
  nose:  ["Чих!", "Нос — это святое.", "Фыр!"],
  head:  ["Мурррр…", "Чешется именно здесь.", "Глаза сами закрываются."],
  belly: ["Живот — ловушка. Ты попался.", "Урчит, но не от еды.", "Можно, но осторожно."],
  tail:  ["За хвост — нельзя!", "Мяу! Это перебор.", "Хвост обиделся."],
  floor: ["Что там?", "Смотрит в пустоту.", "Хвостом по полу."],
};

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function touch(zone, sx, sy) {
  if (S.sleeping) {
    if (zone !== "floor") {
      S.sleeping = false;
      say("Разбудил. Ну спасибо.");
      Sound.meow(0.8);
      S.stats.happy = clamp(S.stats.happy - 4, 0, MAX);
      updateHUD(); save();
    }
    return;
  }
  S.pets++;
  if (zone === "tail") {
    S.stats.happy = clamp(S.stats.happy - 3, 0, MAX);
    A.headShake = 1; A.startled = 1;
    Sound.meow(1.25);
    say(pick(REACT.tail));
  } else if (zone === "nose") {
    A.startled = 1; A.bounce = 0.6;
    Sound.chirp();
    say(pick(REACT.nose));
  } else if (zone === "ear") {
    A.earTwitch = 1;
    Sound.chirp();
    say(pick(REACT.ear));
  } else if (zone === "head" || zone === "belly") {
    S.stats.happy = clamp(S.stats.happy + 1.5, 0, MAX);
    A.petting = Math.min(2.2, A.petting + 0.7);
    A.hearts.push({ x: 440 + Math.random() * 120, y: 420, life: 1.3, s: 0.8 + Math.random() * 0.6 });
    say(pick(REACT[zone]));
  } else {
    say(pick(REACT.floor));
  }
  updateHUD(); save();
}

let pressing = false, lastPt = null, strokeAcc = 0;

sceneEl.addEventListener("pointerdown", (e) => {
  sceneEl.setPointerCapture(e.pointerId);
  pressing = true; strokeAcc = 0;
  const r = sceneEl.getBoundingClientRect();
  lastPt = { x: e.clientX - r.left, y: e.clientY - r.top };
  touch(zoneAt(toVirtual(lastPt.x, lastPt.y)), lastPt.x, lastPt.y);
});

sceneEl.addEventListener("pointermove", (e) => {
  const r = sceneEl.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const v = toVirtual(px, py);
  A.tLookX = clamp((v.x - 500) / 420, -1, 1);
  A.tLookY = clamp((v.y - 330) / 420, -1, 1);

  if (!pressing || S.sleeping) { lastPt = { x: px, y: py }; return; }
  if (lastPt) {
    const d = Math.hypot(px - lastPt.x, py - lastPt.y);
    const z = zoneAt(v);
    if (z === "head" || z === "belly") {
      strokeAcc += d;
      A.petting = Math.min(2.4, A.petting + d / 260);
      if (strokeAcc > 140) {
        strokeAcc = 0;
        S.stats.happy = clamp(S.stats.happy + 1.2, 0, MAX);
        A.hearts.push({ x: 430 + Math.random() * 140, y: 430, life: 1.2, s: 0.7 + Math.random() * 0.5 });
        updateHUD(); save();
      }
    }
  }
  lastPt = { x: px, y: py };
});

function endPress() { pressing = false; lastPt = null; }
sceneEl.addEventListener("pointerup", endPress);
sceneEl.addEventListener("pointercancel", endPress);
sceneEl.addEventListener("pointerleave", () => { endPress(); A.tLookX = 0; A.tLookY = 0; });
</script>

<script>
"use strict";
/* ============================================================
   Интерфейс: показатели, действия, магазин, внешность, мини-игры.
   ============================================================ */

const STAT_DEFS = [
  { key: "hunger", name: "Сытость" },
  { key: "energy", name: "Бодрость" },
  { key: "happy",  name: "Радость" },
  { key: "clean",  name: "Чистота" },
];

const statsEl = document.getElementById("stats");
const sheetEl = document.getElementById("sheet");
const sheetBody = document.getElementById("sheetBody");
const sheetTitle = document.getElementById("sheetTitle");

statsEl.innerHTML = STAT_DEFS.map(d =>
  '<div class="stat" data-k="' + d.key + '">' +
    '<div class="stat-top"><span class="stat-name">' + d.name + '</span><span class="stat-val">0</span></div>' +
    '<div class="meter"><i style="width:0%"></i></div>' +
  '</div>').join("");

function barColor(v) { return v < 25 ? "var(--bad)" : v < 55 ? "var(--warn)" : "var(--good)"; }

function updateHUD() {
  for (const d of STAT_DEFS) {
    const box = statsEl.querySelector('[data-k="' + d.key + '"]');
    const v = Math.round(S.stats[d.key]);
    box.querySelector(".stat-val").textContent = v;
    const bar = box.querySelector(".meter > i");
    bar.style.width = v + "%";
    bar.style.background = barColor(v);
    box.classList.toggle("low", v < 25);
  }
  document.getElementById("coinCount").textContent = S.coins;
  document.getElementById("coinCount2").textContent = S.coins;
  document.getElementById("petName").textContent = S.name;
  const days = Math.max(1, Math.floor((Date.now() - S.born) / 86400000) + 1);
  const stage = days < 7 ? "котёнок" : days < 30 ? "подросток" : "взрослый кот";
  document.getElementById("petAge").textContent = stage + ", " + days + "-й день";
  document.getElementById("soundWave").style.opacity = S.sound ? "1" : "0.2";
}

/* ---------- панель ---------- */

function openSheet(title, html) {
  sheetTitle.textContent = title;
  sheetBody.innerHTML = html;
  sheetEl.hidden = false;
}
function closeSheet() { sheetEl.hidden = true; stopGame(); sheetBody.innerHTML = ""; }
document.getElementById("sheetClose").addEventListener("click", closeSheet);
sheetEl.addEventListener("click", (e) => { if (e.target === sheetEl) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !sheetEl.hidden) closeSheet(); });

/* ---------- кормление ---------- */

function openFeed() {
  const cards = FOODS.map(f => {
    const afford = S.coins >= f.price;
    return '<button class="card" data-food="' + f.id + '"' + (afford ? "" : " disabled") + '>' +
      '<h4>' + f.name + '</h4>' +
      '<p>' + f.desc + '</p>' +
      '<p>Сытость +' + f.hunger + ' · Радость +' + f.happy + '</p>' +
      '<span class="price">' + (f.price ? '<span class="coin-dot"></span>' + f.price : "бесплатно") + '</span>' +
    '</button>';
  }).join("");
  openSheet("Чем кормим", '<div class="grid">' + cards + '</div>' +
    '<p class="hint">Сухой корм всегда в миске. Остальное покупается за монеты — их дают мини-игры.</p>');
  sheetBody.querySelectorAll("[data-food]").forEach(btn => {
    btn.addEventListener("click", () => feed(btn.dataset.food));
  });
}

function feed(id) {
  const f = FOODS.find(x => x.id === id);
  if (!f || S.coins < f.price) return;
  if (S.stats.hunger > 94) { say("Больше не лезет."); return; }
  S.coins -= f.price;
  S.stats.hunger = clamp(S.stats.hunger + f.hunger, 0, MAX);
  S.stats.happy = clamp(S.stats.happy + f.happy, 0, MAX);
  S.stats.energy = clamp(S.stats.energy + f.energy, 0, MAX);
  S.stats.clean = clamp(S.stats.clean - 4, 0, MAX);
  S.meals++;
  S.sleeping = false;
  A.eat = 1; A.eatFood = f.id; A.bounce = 0.8;
  closeSheet();
  let n = 0;
  const chew = setInterval(() => { Sound.crunch(); if (++n > 5) clearInterval(chew); }, 220);
  say(f.id === "milk" ? "Лакает молоко." : "Хрум-хрум.");
  updateHUD(); save(true);
}

/* ---------- мытьё и сон ---------- */

function wash() {
  if (S.stats.clean > 92) { say("И так чистый."); return; }
  S.sleeping = false;
  S.stats.clean = MAX;
  S.stats.happy = clamp(S.stats.happy - 3, 0, MAX);
  S.washes++;
  A.wash = 1; A.headShake = 1;
  for (let i = 0; i < 40; i++) {
    A.foam.push({ x: 340 + Math.random() * 320, y: 500 + Math.random() * 380, r: 6 + Math.random() * 16, v: 0.4 + Math.random(), life: 1 + Math.random() * 1.6 });
  }
  Sound.splash();
  setTimeout(() => Sound.meow(1.15), 450);
  say("Мокрый и недовольный. Зато чистый.");
  updateHUD(); save(true);
}

function toggleSleep() {
  if (!S.sleeping && S.stats.energy > 88) { say("Совсем не хочет спать."); return; }
  S.sleeping = !S.sleeping;
  if (S.sleeping) { Sound.purr(false); say("Свернулся клубком."); }
  else { say("Потянулся."); Sound.meow(0.9); }
  updateHUD(); save(true);
}

/* ---------- магазин ---------- */

function shopHTML(tab) {
  if (tab === "rooms") {
    return '<div class="grid">' + ROOMS.map(r => {
      const owned = S.owned.includes(r.id), active = S.room === r.id;
      return '<button class="card ' + (active ? "worn" : owned ? "owned" : "") + '" data-room="' + r.id + '"' +
        (!owned && S.coins < r.price ? " disabled" : "") + '>' +
        '<h4>' + r.name + '</h4><p>' + r.desc + '</p>' +
        '<span class="price">' + (active ? "на сцене" : owned ? "выбрать" : '<span class="coin-dot"></span>' + r.price) + '</span></button>';
    }).join("") + '</div>';
  }
  return '<div class="grid">' + WEARABLES.map(w => {
    const owned = S.owned.includes(w.id), worn = S.worn[w.slot] === w.id;
    return '<button class="card ' + (worn ? "worn" : owned ? "owned" : "") + '" data-wear="' + w.id + '"' +
      (!owned && S.coins < w.price ? " disabled" : "") + '>' +
      '<h4>' + w.name + '</h4><p>' + w.desc + '</p>' +
      '<span class="price">' + (worn ? "снять" : owned ? "надеть" : '<span class="coin-dot"></span>' + w.price) + '</span></button>';
  }).join("") + '</div>';
}

function openShop(tab) {
  tab = tab || "wear";
  openSheet("Магазин",
    '<div class="tabs">' +
      '<button class="tab" data-tab="wear" aria-selected="' + (tab === "wear") + '">Наряды</button>' +
      '<button class="tab" data-tab="rooms" aria-selected="' + (tab === "rooms") + '">Комнаты</button>' +
    '</div>' + shopHTML(tab) +
    '<p class="hint">Монеты зарабатываются в мини-играх. Купленное остаётся навсегда.</p>');

  sheetBody.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => openShop(b.dataset.tab)));
  sheetBody.querySelectorAll("[data-wear]").forEach(b => b.addEventListener("click", () => {
    const w = WEARABLES.find(x => x.id === b.dataset.wear);
    if (!S.owned.includes(w.id)) {
      if (S.coins < w.price) return;
      S.coins -= w.price; S.owned.push(w.id);
      S.stats.happy = clamp(S.stats.happy + 4, 0, MAX);
      Sound.coin();
    }
    S.worn[w.slot] = S.worn[w.slot] === w.id ? null : w.id;
    Sound.pop();
    updateHUD(); save(true); openShop("wear");
  }));
  sheetBody.querySelectorAll("[data-room]").forEach(b => b.addEventListener("click", () => {
    const r = ROOMS.find(x => x.id === b.dataset.room);
    if (!S.owned.includes(r.id)) {
      if (S.coins < r.price) return;
      S.coins -= r.price; S.owned.push(r.id); Sound.coin();
    }
    S.room = r.id; Sound.pop();
    updateHUD(); save(true); openShop("rooms");
  }));
}

/* ---------- внешность ---------- */

function paintCoatSwatch(canvas, c) {
  const g = canvas.getContext("2d");
  const w = canvas.width = 92, h = canvas.height = 92;
  g.fillStyle = c.base; g.fillRect(0, 0, w, h);
  if (c.pattern === "tabby") {
    g.strokeStyle = c.mark; g.lineWidth = 9; g.globalAlpha = 0.65;
    for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(-6, 12 + i * 24); g.quadraticCurveTo(w / 2, 2 + i * 24, w + 6, 14 + i * 24); g.stroke(); }
  } else if (c.pattern === "tuxedo") {
    g.fillStyle = c.belly; g.beginPath(); g.ellipse(w / 2, h, w * 0.3, h * 0.6, 0, 0, Math.PI * 2); g.fill();
  } else if (c.pattern === "point") {
    const rg = g.createRadialGradient(w / 2, h, 4, w / 2, h, h);
    rg.addColorStop(0, c.mark); rg.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = rg; g.fillRect(0, 0, w, h);
  } else if (c.pattern === "calico") {
    g.fillStyle = c.mark; g.beginPath(); g.ellipse(26, 30, 24, 20, 0.4, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#3A3336"; g.beginPath(); g.ellipse(66, 64, 22, 18, -0.3, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = "rgba(255,255,255,.14)"; g.fillRect(0, 0, w, h * 0.32);
}

function paintEyeSwatch(canvas, e) {
  const g = canvas.getContext("2d");
  const w = canvas.width = 92, h = canvas.height = 92;
  g.fillStyle = "#2A1F1C"; g.fillRect(0, 0, w, h);
  const draw = (cx, pal) => {
    const rg = g.createRadialGradient(cx - 5, 38, 2, cx, 46, 30);
    rg.addColorStop(0, pal.inner); rg.addColorStop(0.6, mix(pal.inner, pal.outer, 0.5)); rg.addColorStop(1, pal.outer);
    g.fillStyle = rg; g.beginPath(); g.arc(cx, 46, 30, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#120C0C"; g.beginPath(); g.ellipse(cx, 46, 6, 27, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(255,255,255,.9)"; g.beginPath(); g.arc(cx - 10, 34, 6, 0, Math.PI * 2); g.fill();
  };
  if (e.odd) { draw(26, e); draw(66, e.odd); } else draw(46, e);
}

function openLook() {
  const coats = COATS.map(c => '<button class="sw" data-coat="' + c.id + '" aria-pressed="' + (S.coat === c.id) + '" title="' + c.name + '"><canvas></canvas></button>').join("");
  const eyes = EYES.map(e => '<button class="sw" data-eye="' + e.id + '" aria-pressed="' + (S.eyes === e.id) + '" title="' + e.name + '"><canvas></canvas></button>').join("");
  openSheet("Внешность",
    '<div class="section-label">Шерсть</div><div class="swatches" id="coatRow">' + coats + '</div>' +
    '<div class="section-label">Глаза</div><div class="swatches" id="eyeRow">' + eyes + '</div>' +
    '<div class="section-label">Имя</div>' +
    '<label class="field" for="nameInput"><input id="nameInput" type="text" maxlength="18" value="' + S.name.replace(/"/g, "&quot;") + '"></label>' +
    '<p class="hint">Смена окраса бесплатна — это же твой кот.</p>');

  sheetBody.querySelectorAll("[data-coat]").forEach(b => {
    paintCoatSwatch(b.querySelector("canvas"), COATS.find(c => c.id === b.dataset.coat));
    b.addEventListener("click", () => { S.coat = b.dataset.coat; Cat.layers = null; Sound.pop(); save(true); openLook(); });
  });
  sheetBody.querySelectorAll("[data-eye]").forEach(b => {
    paintEyeSwatch(b.querySelector("canvas"), EYES.find(e => e.id === b.dataset.eye));
    b.addEventListener("click", () => { S.eyes = b.dataset.eye; Cat.layers = null; Sound.pop(); save(true); openLook(); });
  });
  const input = document.getElementById("nameInput");
  input.addEventListener("input", () => { S.name = input.value.trim() || "Мурлыка"; updateHUD(); save(); });
  resize();
}
</script>

<script>
"use strict";
/* ============================================================
   Мини-игры, онбординг и запуск.
   ============================================================ */

let gameLoop = null, gameTimer = null;
function stopGame() {
  if (gameLoop) { cancelAnimationFrame(gameLoop); gameLoop = null; }
  if (gameTimer) { clearInterval(gameTimer); gameTimer = null; }
}

function finishGame(name, score, key) {
  stopGame();
  const best = Math.max(S.records[key] || 0, score);
  const isRecord = score > (S.records[key] || 0);
  S.records[key] = best;
  S.games++;
  S.stats.happy = clamp(S.stats.happy + Math.min(18, 6 + score / 3), 0, MAX);
  S.stats.energy = clamp(S.stats.energy - 6, 0, MAX);
  S.stats.hunger = clamp(S.stats.hunger - 4, 0, MAX);
  S.coins += score;
  updateHUD(); save(true);
  openSheet(name, '<div class="card" style="text-align:center;padding:22px">' +
    '<h4 style="font-size:17px">' + (isRecord ? "Новый рекорд!" : "Игра окончена") + '</h4>' +
    '<p style="font-size:14px">Очков: <b>' + score + '</b> · Лучший результат: <b>' + best + '</b></p>' +
    '<p style="font-size:14px">Заработано монет: <b>' + score + '</b></p></div>' +
    '<button class="primary" id="againBtn">Ещё раз</button>' +
    '<p class="hint">' + S.name + ' доволен и немного устал.</p>');
  document.getElementById("againBtn").addEventListener("click", openPlay);
  Sound.coin();
}

function gameShell(title, hudRight) {
  openSheet(title,
    '<div class="game-hud"><span id="gScore">0</span><span id="gTime">' + hudRight + '</span></div>' +
    '<div class="game-wrap" id="gWrap" style="height:300px"><canvas id="gCanvas"></canvas></div>' +
    '<p class="hint" id="gHint"></p>');
  const wrap = document.getElementById("gWrap");
  const c = document.getElementById("gCanvas");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = wrap.clientWidth, h = 300;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { c, g, w, h };
}

/* ---------- мини-игра: мышки ---------- */

function startMice() {
  const { c, g, w, h } = gameShell("Поймай мышку", "30");
  document.getElementById("gHint").textContent = "Мыши выбегают из нор. Лови касанием, пока не убежали.";
  let score = 0, time = 30, mice = [], spawnIn = 0;

  c.addEventListener("pointerdown", (e) => {
    const r = c.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    for (let i = mice.length - 1; i >= 0; i--) {
      const m = mice[i];
      if (Math.hypot(m.x - x, m.y - y) < 32) {
        mice.splice(i, 1); score++; Sound.chirp();
        document.getElementById("gScore").textContent = score;
        return;
      }
    }
    Sound.pop();
  });

  gameTimer = setInterval(() => {
    time--;
    const el = document.getElementById("gTime");
    if (el) el.textContent = String(time);
    if (time <= 0) finishGame("Поймай мышку", score, "mice");
  }, 1000);

  let prev = performance.now();
  (function loop(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    spawnIn -= dt;
    if (spawnIn <= 0) {
      spawnIn = Math.max(0.28, 1.1 - (30 - time) * 0.025);
      const dir = Math.random() < 0.5 ? 1 : -1;
      mice.push({ x: dir > 0 ? -30 : w + 30, y: 50 + Math.random() * (h - 100), v: dir * (90 + Math.random() * 130), wob: Math.random() * 6 });
    }
    g.clearRect(0, 0, w, h);
    const fl = g.createLinearGradient(0, 0, 0, h);
    fl.addColorStop(0, "#C8A878"); fl.addColorStop(1, "#A47E52");
    g.fillStyle = fl; g.fillRect(0, 0, w, h);
    g.fillStyle = "rgba(60,40,20,.25)";
    for (let i = 0; i < 4; i++) { g.beginPath(); g.ellipse((i + 1) * w / 5, h - 8, 26, 12, 0, Math.PI, 0); g.fill(); }

    for (let i = mice.length - 1; i >= 0; i--) {
      const m = mice[i];
      m.x += m.v * dt;
      m.wob += dt * 12;
      const y = m.y + Math.sin(m.wob) * 4;
      if (m.x < -60 || m.x > w + 60) { mice.splice(i, 1); continue; }
      g.save();
      g.translate(m.x, y);
      g.scale(m.v > 0 ? 1 : -1, 1);
      g.strokeStyle = "#9A8A80"; g.lineWidth = 2.5; g.lineCap = "round";
      g.beginPath(); g.moveTo(-16, 2); g.quadraticCurveTo(-34, 2, -30, -10); g.stroke();
      g.fillStyle = "#8E8078";
      g.beginPath(); g.ellipse(0, 0, 18, 12, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#C9A9A2";
      g.beginPath(); g.arc(11, -9, 7, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#8E8078";
      g.beginPath(); g.ellipse(16, -1, 8, 7, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#2B2320";
      g.beginPath(); g.arc(20, -2, 2, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    gameLoop = requestAnimationFrame(loop);
  })(prev);
}

/* ---------- мини-игра: клубки ---------- */

function startYarn() {
  const { c, g, w, h } = gameShell("Лови клубки", "3 жизни");
  document.getElementById("gHint").textContent = "Веди лапу пальцем. Клубки лови, ботинки пропускай.";
  let score = 0, lives = 3, items = [], spawnIn = 0, paw = w / 2;

  function movePaw(e) {
    const r = c.getBoundingClientRect();
    paw = clamp((e.touches ? e.touches[0].clientX : e.clientX) - r.left, 36, w - 36);
  }
  c.addEventListener("pointermove", movePaw);
  c.addEventListener("pointerdown", movePaw);

  let prev = performance.now();
  (function loop(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    spawnIn -= dt;
    if (spawnIn <= 0) {
      spawnIn = Math.max(0.35, 0.95 - score * 0.012);
      const bad = Math.random() < 0.22;
      items.push({ x: 30 + Math.random() * (w - 60), y: -24, v: 110 + Math.random() * 90 + score * 1.5, bad, spin: Math.random() * 6 });
    }
    g.clearRect(0, 0, w, h);
    const bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, "#E3D3B8"); bg.addColorStop(1, "#C7AE8C");
    g.fillStyle = bg; g.fillRect(0, 0, w, h);

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.v * dt; it.spin += dt * 4;
      if (it.y > h - 34 && Math.abs(it.x - paw) < 44) {
        items.splice(i, 1);
        if (it.bad) { lives--; Sound.sad(); } else { score++; Sound.chirp(); }
        document.getElementById("gScore").textContent = score;
        const el = document.getElementById("gTime");
        if (el) el.textContent = lives + (lives === 1 ? " жизнь" : " жизни");
        if (lives <= 0) { finishGame("Лови клубки", score, "yarn"); return; }
        continue;
      }
      if (it.y > h + 30) {
        items.splice(i, 1);
        if (!it.bad) {
          lives--; Sound.sad();
          const el = document.getElementById("gTime");
          if (el) el.textContent = lives + (lives === 1 ? " жизнь" : " жизни");
          if (lives <= 0) { finishGame("Лови клубки", score, "yarn"); return; }
        }
        continue;
      }
      g.save(); g.translate(it.x, it.y); g.rotate(it.spin);
      if (it.bad) {
        g.fillStyle = "#5C4433";
        g.beginPath(); g.ellipse(0, 4, 20, 11, 0, 0, Math.PI * 2); g.fill();
        g.fillRect(-6, -14, 16, 18);
      } else {
        g.fillStyle = "#D2694F";
        g.beginPath(); g.arc(0, 0, 17, 0, Math.PI * 2); g.fill();
        g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 2;
        for (let k = -2; k <= 2; k++) { g.beginPath(); g.arc(0, 0, 17, k * 0.5, k * 0.5 + 1.6); g.stroke(); }
      }
      g.restore();
    }

    // лапа
    g.save();
    g.translate(paw, h - 18);
    g.fillStyle = coat().base;
    g.beginPath(); g.ellipse(0, 0, 40, 22, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#E7B4AE";
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.ellipse(i * 15, -8, 7, 6, 0, 0, Math.PI * 2); g.fill(); }
    g.beginPath(); g.ellipse(0, 5, 15, 10, 0, 0, Math.PI * 2); g.fill();
    g.restore();

    gameLoop = requestAnimationFrame(loop);
  })(prev);
}

/* ---------- мини-игра: память ---------- */

const MEM_ICONS = {
  fish: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M6 24c6-9 14-13 22-13s13 5 14 13c-1 8-6 13-14 13S12 33 6 24z"/><path d="M42 24l-8-7v14l8-7z"/><circle cx="16" cy="21" r="1.6" fill="currentColor"/></svg>',
  paw:  '<svg viewBox="0 0 48 48" fill="currentColor"><ellipse cx="24" cy="31" rx="11" ry="9"/><ellipse cx="12" cy="20" rx="4.6" ry="6"/><ellipse cx="20" cy="14" rx="4.6" ry="6.4"/><ellipse cx="29" cy="14" rx="4.6" ry="6.4"/><ellipse cx="37" cy="20" rx="4.6" ry="6"/></svg>',
  yarn: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="24" cy="24" r="14"/><path d="M12 20c7 2 15 8 19 14M14 30c6-6 14-10 20-11M20 11c3 7 9 14 15 17"/></svg>',
  milk: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M16 8h16l4 10v22H12V18l4-10z"/><path d="M12 22h24"/></svg>',
  bell: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M24 8a10 10 0 0 1 10 10c0 10 4 13 4 13H10s4-3 4-13A10 10 0 0 1 24 8z"/><path d="M20 36a4 4 0 0 0 8 0"/></svg>',
  bird: '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M34 16a8 8 0 1 0-14 5c0 0-8 1-12 9 10 2 16 0 20-3 6-4 7-9 7-9l5-3-6 1z"/><circle cx="31" cy="14" r="1.6" fill="currentColor"/></svg>',
};

function startMemory() {
  const keys = Object.keys(MEM_ICONS);
  const deck = keys.concat(keys).sort(() => Math.random() - 0.5);
  let open = [], moves = 0, done = 0, lock = false;

  openSheet("Найди пару",
    '<div class="game-hud"><span>Ходов: <span id="mMoves">0</span></span><span>Пар: <span id="mPairs">0</span>/6</span></div>' +
    '<div class="memory-grid" id="mGrid">' +
    deck.map((k, i) => '<button class="mcard" data-i="' + i + '" data-k="' + k + '">' + MEM_ICONS[k] + '</button>').join("") +
    '</div><p class="hint">Чем меньше ходов, тем больше монет: 60 минус ходы.</p>');

  const grid = document.getElementById("mGrid");
  grid.addEventListener("click", (e) => {
    const b = e.target.closest(".mcard");
    if (!b || lock || b.classList.contains("up") || b.classList.contains("done")) return;
    b.classList.add("up");
    open.push(b);
    Sound.pop();
    if (open.length === 2) {
      moves++;
      document.getElementById("mMoves").textContent = String(moves);
      if (open[0].dataset.k === open[1].dataset.k) {
        open.forEach(x => { x.classList.remove("up"); x.classList.add("done"); });
        open = []; done++;
        document.getElementById("mPairs").textContent = String(done);
        Sound.chirp();
        if (done === 6) setTimeout(() => finishGame("Найди пару", Math.max(6, 60 - moves), "memory"), 500);
      } else {
        lock = true;
        setTimeout(() => { open.forEach(x => x.classList.remove("up")); open = []; lock = false; }, 700);
      }
    }
  });
}

/* ---------- выбор игры ---------- */

function openPlay() {
  stopGame();
  openSheet("Во что играем",
    '<div class="grid">' +
      '<button class="card" data-game="mice"><h4>Поймай мышку</h4><p>30 секунд на реакцию.</p><span class="price">Рекорд: ' + (S.records.mice || 0) + '</span></button>' +
      '<button class="card" data-game="yarn"><h4>Лови клубки</h4><p>Три жизни, растущая скорость.</p><span class="price">Рекорд: ' + (S.records.yarn || 0) + '</span></button>' +
      '<button class="card" data-game="memory"><h4>Найди пару</h4><p>Шесть пар, чем меньше ходов — тем лучше.</p><span class="price">Рекорд: ' + (S.records.memory || 0) + '</span></button>' +
    '</div><p class="hint">За очки дают монеты. Игра радует кота, но отнимает силы и аппетит.</p>');
  sheetBody.querySelectorAll("[data-game]").forEach(b => b.addEventListener("click", () => {
    S.sleeping = false;
    if (b.dataset.game === "mice") startMice();
    else if (b.dataset.game === "yarn") startYarn();
    else startMemory();
  }));
}

/* ---------- онбординг ---------- */

function previewCat(canvas) {
  const w = canvas.clientWidth || 380, h = canvas.clientHeight || 168;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0, "#F0E2CC"); bg.addColorStop(1, "#D7C2A4");
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  const s = Math.min(w / 460, h / 330);
  Cat.layers = null;
  Cat.build(Math.max(0.5, s * dpr));
  const L = Cat.layers;
  if (!L) return;
  g.save();
  g.translate(w / 2, h * 0.58);
  g.scale(s, s);
  g.translate(-500, -320);
  g.drawImage(L.head.cv, L.head.x0, L.head.y0, L.head.w, L.head.h);
  drawFace(g, { blink: 0, lid: 0, squint: 0.1, pupil: 0.5, smile: 0.5, mouth: 0, whisker: 0, lookX: 0, lookY: 0 });
  g.restore();
}

function setupIntro() {
  const introEl = document.getElementById("intro");
  const canvas = document.getElementById("introCanvas");
  const coatRow = document.getElementById("introCoats");
  const eyeRow = document.getElementById("introEyes");

  coatRow.innerHTML = COATS.map(c => '<button class="sw" data-coat="' + c.id + '" aria-pressed="' + (S.coat === c.id) + '" title="' + c.name + '"><canvas></canvas></button>').join("");
  eyeRow.innerHTML = EYES.map(e => '<button class="sw" data-eye="' + e.id + '" aria-pressed="' + (S.eyes === e.id) + '" title="' + e.name + '"><canvas></canvas></button>').join("");

  coatRow.querySelectorAll("[data-coat]").forEach(b => {
    paintCoatSwatch(b.querySelector("canvas"), COATS.find(c => c.id === b.dataset.coat));
    b.addEventListener("click", () => {
      S.coat = b.dataset.coat;
      coatRow.querySelectorAll("[data-coat]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      previewCat(canvas);
    });
  });
  eyeRow.querySelectorAll("[data-eye]").forEach(b => {
    paintEyeSwatch(b.querySelector("canvas"), EYES.find(e => e.id === b.dataset.eye));
    b.addEventListener("click", () => {
      S.eyes = b.dataset.eye;
      eyeRow.querySelectorAll("[data-eye]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      previewCat(canvas);
    });
  });

  introEl.hidden = false;
  requestAnimationFrame(() => previewCat(canvas));

  document.getElementById("introGo").addEventListener("click", () => {
    const n = document.getElementById("introName").value.trim();
    S.name = n || "Мурлыка";
    S.born = Date.now(); S.seen = Date.now();
    introEl.hidden = true;
    Cat.layers = null;
    resize(); updateHUD(); save(true);
    Sound.meow(1.1);
    say("Привет! Я " + S.name + ".", 3000);
  });
}

/* ---------- запуск ---------- */

document.querySelectorAll(".act").forEach(b => {
  b.addEventListener("click", () => {
    const a = b.dataset.act;
    if (a === "feed") openFeed();
    else if (a === "wash") wash();
    else if (a === "sleep") toggleSleep();
    else if (a === "play") openPlay();
    else if (a === "shop") openShop();
    else if (a === "look") openLook();
  });
});

document.getElementById("soundBtn").addEventListener("click", () => {
  S.sound = !S.sound;
  if (!S.sound) Sound.purr(false); else Sound.pop();
  updateHUD(); save(true);
});

window.addEventListener("resize", () => { clearTimeout(resize._t); resize._t = setTimeout(resize, 150); });
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { applyElapsed(); updateHUD(); save(true); }
  else { Sound.purr(false); save(true); }
});

(function init() {
  isNew = !load();
  applyElapsed();
  updateHUD();
  resize();
  requestAnimationFrame(frame);

  // показатели тикают и при открытой игре
  setInterval(() => { applyElapsed(); updateHUD(); save(); }, 20000);

  if (isNew) setupIntro();
  else setTimeout(() => {
    const m = mood();
    if (m === "hungry") say(S.name + " просит есть.");
    else if (m === "dirty") say("Кто-то изрядно испачкался.");
    else if (m === "sad") say("Скучал.");
    else say("С возвращением.");
  }, 600);
})();
</script>
